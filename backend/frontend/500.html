<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 — Server Error | CipherPoint</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    <style>
        .error-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        .error-card {
            max-width: 520px;
            text-align: center;
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 16px;
            padding: 3rem 2rem;
        }
        .error-code {
            font-size: 5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #f85149 0%, #d29922 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1;
            margin-bottom: 0.5rem;
        }
        .error-title {
            color: #e6edf3;
            font-size: 1.5rem;
            font-weight: 600;
            margin: 0.5rem 0 0.8rem;
        }
        .error-msg {
            color: #8b949e;
            font-size: 0.95rem;
            margin-bottom: 1rem;
        }
        .error-detail {
            color: #6e7681;
            font-size: 0.8rem;
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 0.5rem 0.8rem;
            margin-bottom: 1.5rem;
            word-break: break-all;
        }
        .error-actions {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .error-glyph {
            font-size: 3rem;
            color: #f85149;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body data-page="error-500">
    <canvas id="networkCanvas" width="1920" height="1080" style="position:fixed;inset:0;width:100vw;height:100vh;z-index:0;pointer-events:none;display:block;"></canvas>

    <div class="error-page">
        <div class="error-card">
            <div class="error-glyph"><i class="fa-solid fa-triangle-exclamation"></i></div>
            <div class="error-code">500</div>
            <h1 class="error-title">Intelligence Feed Interrupted</h1>
            <p class="error-msg">Something went wrong on our end. The investigation team has been alerted.</p>
            <div class="error-detail" id="errorDetail">Trace ID: pending</div>
            <div class="error-actions">
                <a href="dashboard.html" class="btn btn-primary"><i class="fa-solid fa-rotate-right"></i> Try Again</a>
                <a href="index.html" class="btn btn-light"><i class="fa-solid fa-house"></i> Home</a>
                <button class="btn btn-light" onclick="location.reload()"><i class="fa-solid fa-arrows-rotate"></i> Reload</button>
            </div>
        </div>
    </div>

    <footer class="site-footer">
        <div class="container footer-inner">
            <div>© 2026 CipherPoint</div>
            <div class="footer-links">
                <a href="about.html">About</a>
                <a href="contact.html">Contact</a>
                <a href="api-docs.html">API</a>
                <a href="terms.html">Terms</a>
                <a href="privacy.html">Privacy</a>
            </div>
            <div>Secure OSINT lab infrastructure</div>
        </div>
    </footer>

    <script>
      // Generate a fake trace ID so the user can quote it in a bug report
      const detail = document.getElementById('errorDetail');
      if (detail) {
        const t = Date.now().toString(36);
        const r = Math.random().toString(36).slice(2, 8);
        detail.textContent = 'Trace ID: cp-' + t + '-' + r;
      }
    </script>
</body>
</html>
