<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CipherPoint | Create Profile</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body data-page="signup">
    <canvas id="networkCanvas" width="1920" height="1080" style="position:fixed;inset:0;width:100vw;height:100vh;z-index:0;pointer-events:none;display:block;"></canvas>
    <div class="auth-container">
        <div class="auth-left">
            <div class="auth-left-content">
                <div class="brand-mark-icon"><i class="fa-solid fa-user-secret"></i></div>
                <div class="brand-text">CipherPoint</div>
                <p class="auth-left-subtitle">Open Source Intelligence & Digital Forensics</p>
            </div>
        </div>
        <div class="auth-right">
            <div class="auth-form-wrapper">
                <div class="auth-brand">
                <div class="brand-mark-icon"><i class="fa-solid fa-user-secret"></i></div>
                    <div>
                        <span class="eyebrow">CipherPoint</span>
                        <h2>Register Analyst</h2>
                    </div>
                </div>

                <form id="signupForm" class="auth-form">
                    <div class="field-wrap">
                        <label for="signupUsername"><i class="fa-solid fa-user-tag"></i> Username</label>
                        <input id="signupUsername" type="text" placeholder="Choose username" required>
                    </div>
                    <div class="field-wrap">
                        <label for="signupEmail"><i class="fa-solid fa-envelope"></i> Email</label>
                        <input id="signupEmail" type="email" placeholder="Enter email address" required>
                    </div>
                    <div class="field-wrap">
                        <label for="signupPassword"><i class="fa-solid fa-key"></i> Password</label>
                        <div class="password-field">
                            <input id="signupPassword" type="password" placeholder="Create password" required>
                            <button type="button" class="password-toggle" aria-label="Toggle password visibility">
                                <i class="fa-solid fa-eye"></i>
                            </button>
                        </div>
                        <div class="password-strength" id="passwordStrength">
                            <div class="strength-bar"><div class="strength-fill"></div></div>
                            <span class="strength-text">Enter password</span>
                        </div>
                    </div>
                    <div class="field-wrap">
                        <label for="signupConfirm"><i class="fa-solid fa-key"></i> Confirm Password</label>
                        <div class="password-field">
                            <input id="signupConfirm" type="password" placeholder="Confirm password" required>
                            <button type="button" class="password-toggle" aria-label="Toggle password visibility">
                                <i class="fa-solid fa-eye"></i>
                            </button>
                        </div>
                    </div>
                    <label class="checkbox-wrap">
                        <input type="checkbox" id="agreeTerms" required>
                        <span class="checkmark"></span>
                        I agree to the <a href="terms.html">Terms of Service</a> and <a href="privacy.html">Privacy Policy</a>
                    </label>
                    <div class="cf-turnstile" data-sitekey="0x4AAAAAAEluDz4B8bvFcmsF" data-callback="onTurnstileSuccessSignup" data-theme="dark"></div>
                    <input type="hidden" id="signupTurnstileToken" name="cf-turnstile-response">
                    <button type="submit" class="btn btn-primary btn-block">Create Account</button>
                    <div id="signupMessage" class="form-message"></div>
                    <div class="auth-footer">
                        Already enrolled? <a href="login.html">Access console</a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <footer class="site-footer">
        <div class="container footer-inner">
            <div>© 2026 CipherPoint</div>
            <div class="footer-links">
                <a href="terms.html">Terms of Service</a>
                <a href="privacy.html">Privacy Policy</a>
            </div>
            <div>Secure OSINT lab infrastructure</div>
        </div>
    </footer>

    <script src="app.js"></script>
</body>
</html>
