databases:
  - name: cipherpoint-db
    databaseName: cipherpoint
    user: cipherpoint
    plan: free
    ipAllowList: []

services:
  - type: web
    name: cipherpoint
    runtime: python
    plan: free
    region: oregon
    branch: main
    rootDir: backend
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt"
    startCommand: "gunicorn main:app -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT --workers 1 --timeout 120 --access-logfile -"
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: ENV
        value: production
      - key: WORKER_ID
        value: "0"
      - key: DATABASE_URL
        fromDatabase:
          name: cipherpoint-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: FRONTEND_URL
        value: "https://cipherpoint.onrender.com"
      - key: TURNSTILE_ENABLED
        value: "false"
      - key: HOST
        value: "0.0.0.0"
      - key: TELEGRAM_BOT_TOKENS
        sync: false
      - key: TELEGRAM_ADMIN_BOT_TOKEN
        sync: false
      - key: REPORT_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHANNEL_ID
        sync: false
      - key: TELEGRAM_ADMIN_CHAT_ID
        sync: false
      - key: SITE_KEY
        sync: false
      - key: CLOUDFLARE_SECRET_KEY
        sync: false